<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#7f5af0">
    <meta name="description" content="A simple, offline-first to-do list.">
    <title>To Do</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="Assets/icons/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="Assets/icons/apple-touch-icon.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="card">
        <header class="card-header">
            <svg class="logo" viewBox="0 0 512 512" aria-hidden="true">
                <defs>
                    <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
                        <stop offset="0" stop-color="#7f5af0"/>
                        <stop offset="1" stop-color="#2cb67d"/>
                    </linearGradient>
                </defs>
                <rect width="512" height="512" rx="113" fill="url(#lg)"/>
                <path d="M138 271 L226 355 L374 170" fill="none" stroke="#fff" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <div>
                <h1>To Do</h1>
                <p class="tagline">Your day, planned.</p>
            </div>
        </header>

        <form id="todo-form">
            <input id="todo-input" type="text" placeholder="Add a new task" autocomplete="off" maxlength="200">
            <button type="submit">Add</button>
        </form>

        <div class="filters" role="group" aria-label="Filter tasks">
            <button type="button" data-filter="all" class="active">All</button>
            <button type="button" data-filter="active">Active</button>
            <button type="button" data-filter="done">Done</button>
        </div>

        <ul id="todo-list" aria-live="polite"></ul>
        <p id="empty-state" hidden>Nothing here yet &mdash; add a task above.</p>

        <footer class="card-footer">
            <span id="count">0 left</span>
            <button id="clear-done" type="button">Clear completed</button>
        </footer>
    </main>
    <script src="tasks.js"></script>
    <script src="script.js"></script>
</body>
</html>
